<main>
  <div class="login-container">
      <h2>Connexion</h2>
      <form [formGroup]="loginForm" (ngSubmit)="handleSubmit()">
        <div class="form-group">
          <label for="email">Adresse mail :</label>
          <input id="email" type="email" formControlName="email" required placeholder="Entrez votre email">
        </div>

        <div class="form-group">
          <label for="password">Mot de passe :</label>
          <input id="password" type="password" formControlName="password" required placeholder="Entrez votre mot de passe">
        </div>

        <button type="submit">Valider</button>
        <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
      </form>

      <div class="form-links">
        <a href="#">Mot de passe oublié</a>
        <a href="/createAccount">
          <button class="btn-create-account">Créer un compte</button>
        </a>
      </div>
  </div>
</main>
