tags:
  - "SCU"
summary: "Récupérer la liste de toutes les SCUS ( Semantic Content Unit )"
description: "Cette requête retourne la liste de toutes les SCUS."
responses:
  200:
    description: "Liste récupérée avec succès"
    schema:
      type: "array"
      items:
        type: "object"
        properties:
          id_scu:
            type: "integer"
            example: 1
          idea:
            type: "string"
            example: "L'eau est bleue"
          weight:
            type: "integer"
            example: 3
  400:
    description: "Requête invalide"
  500:
    description: "Erreur interne du serveur"



