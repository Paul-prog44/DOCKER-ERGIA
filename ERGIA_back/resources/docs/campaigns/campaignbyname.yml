tags:
  - "Campagnes"
summary: "Récupérer une campagne"
description: "Récupère les détails d'une campagne spécifique en fonction de son nom."
parameters:
  - name: "name"
    in: "path"
    description: "Nom unique de la campagne à récupérer"
    required: true
    type: "string"
responses:
  200:
    description: "Détails de la campagne récupérés avec succès"
    schema:
      type: "object"
      properties:
        creation_date:
          type: "date"
          example: "Fri, 15 Mar 2024 00:00:00 GMT"
        date_phase_1:
          type: "date"
          example: "Mon, 15 Apr 2024 00:00:00 GMT"
        date_phase_2:
          type: "date"
          example: "Wed, 15 May 2024 00:00:00 GMT"
        id_campaign:
          type: "integer"
          example: 1
        name:
          type: "string"
          example: "Tech for Good"
        owner_id:
          type: "integer"
          example: 2
        status_id:
          type: "integer"
          example: 1
  400:
    description: "Requête invalide, par exemple si le nom est manquant ou mal formaté"
  404:
    description: "Aucune campagne trouvée avec le nom fourni"
  500:
    description: "Erreur interne du serveur"