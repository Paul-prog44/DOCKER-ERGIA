tags:
  - "Campagnes"
parameters:
  - in: "body"
    name: "body"
    description: "Ajoute un utilisateur en tant qu'annotateur d'une campagne"
    required: true
    schema:
      $ref: "#/definitions/AddUserCampaignRequest"
definitions:
  AddUserCampaign:
    type: "object"
    properties:
      campaign_id:
        type: "integer"
        example: 1
      user_id:
        type: "integer"
        example: 1
  AddUserCampaignResponse:
    type: "object"
    properties:
        message:
          type: "string"
          example: "L'utilisateur 1 a été ajouté à la campagne 1."
  BadRequestResponse:
    type: "object"
    properties:
      error:
        type: "string"
        example:
          - "Les champs 'campaign_id' et 'user_id' sont obligatoires"
          - "Formulaire incorrect"
responses:
  200:
    description: "Successful response"
    schema:
      $ref: "#/definitions/AddUserCampaignResponse"
  400:
    description: "Bad Request"
    schema:
      $ref: "#/definitions/BadRequestResponse"
  500:
    description: "Internal Server Error"
    schema:
      type: "object"
      properties:
        error:
          type: "string"
          example: "Erreur interne du serveur"

