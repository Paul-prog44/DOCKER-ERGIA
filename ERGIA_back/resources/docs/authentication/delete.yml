tags:
  - "Authentification"
parameters:
  - in: "body"
    name: "body"
    description: "Supprime un utilisateur"
    required: true
    schema:
      $ref: "#/definitions/DeleteRequest"
definitions:
  DeleteRequest:
    type: "object"
    properties:
      user_id:
        type: "integer"
        example: 1
  DeleteResponse:
    type: "object"
    properties:
        message:
          type: "string"
          example: "Utilisateur supprimé avec succès"
  BadRequestResponse:
    type: "object"
    properties:
      error:
        type: "string"
        example: "Aucun compte n'existe à cet email"
responses:
  200:
    description: "Successful response"
    schema:
      $ref: "#/definitions/DeleteResponse"
  400:
    description: "Bad Request"
    schema:
      $ref: "#/definitions/BadRequestResponse"
  500:
    description: "Internal Server Error"
    schema:
      type: "object"
      properties:
        error:
          type: "string"
          example: "Erreur interne du serveur"